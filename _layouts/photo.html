---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    {% if page.date %}
    <p class="post-meta">{{ page.date | date: "%B %-d, %Y" }}</p>
    {% endif %}
  </header>

  <div class="post-content">
    <img src="{{ page.image | relative_url }}" alt="{{ page.title }}" style="max-width: 100%; border-radius: 6px;">
    {{ content }}
  </div>
</article>
